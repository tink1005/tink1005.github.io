<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1200px;height:820px;background:#050505;font-family:'Inter',sans-serif;color:#fff;
    display:flex;flex-direction:column;justify-content:center;gap:54px;padding:0 90px;box-sizing:border-box}
  .row{display:flex;align-items:center;gap:34px}
  .label{position:absolute;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#6c6c6c;font-weight:800;margin-top:-44px}
  .chev{width:120px;height:120px;flex:none}
  .icon{width:128px;height:128px;flex:none}
  .lockword{font-weight:900;font-size:62px;letter-spacing:-2px;text-transform:uppercase;line-height:.9}
  .lockword small{display:block;font-size:15px;letter-spacing:7px;color:#ccff00;margin-top:8px}
  .wordmark{font-weight:900;font-size:58px;letter-spacing:-2.5px;text-transform:uppercase}
  .wordmark .dot{color:#ccff00}
  .sub{font-weight:900;font-size:30px;letter-spacing:-1px;text-transform:uppercase;color:#fff}
  .sub .dot{color:#ccff00}
</style></head>
<body>

  <div class="row">
    <span class="label">The mark</span>
    <svg class="chev" viewBox="0 0 120 120"><path fill="#ccff00" d="M16 28 L60 100 L104 28 L82 28 L60 66 L38 28 Z"/></svg>
    <svg class="icon" viewBox="0 0 120 120"><rect width="120" height="120" rx="26" fill="#0f0f0f"/><path fill="#ccff00" d="M22 32 L60 94 L98 32 L79 32 L60 64 L41 32 Z"/></svg>
  </div>

  <div class="row">
    <span class="label">The lockup</span>
    <svg class="chev" viewBox="0 0 120 120"><path fill="#ccff00" d="M16 28 L60 100 L104 28 L82 28 L60 66 L38 28 Z"/></svg>
    <div class="lockword">STUDIO<br>VALE<small>AGENCY</small></div>
  </div>

  <div class="row">
    <span class="label">The wordmark</span>
    <div class="wordmark">STUDIOVALEAGENCY<span class="dot">.</span></div>
  </div>

</body></html>
